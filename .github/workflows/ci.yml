name: CI

# Phase 0-1 scope (PRODUCTION_EVOLUTION_PROMPT.md §9): lint, types, tests, the
# §4 dependency contract, and the ≥95% coverage gate on src/domain.
#
# The dependency contract and the coverage gate are implemented in-repo on the
# standard library (tests/unit/test_domain_boundary.py and
# scripts/domain_coverage.py) rather than with import-linter and pytest-cov,
# because the development environment has no package-index access and a gate
# that cannot be installed is a gate that never runs. Both are drop-in
# replaceable if that changes.
#
# Now covers §8.1-8.6, 8.8 and 8.9: lint, types, tests, the §4 dependency
# contract, the ≥95% domain coverage gate, gitleaks, the frontend (tsc + vitest
# + axe), Playwright E2E against the composed stack, and the blocking agent eval
# suite. Still outstanding: the ≥80% overall coverage ratchet and the Docker
# build + trivy scan, both of which land with the work they check.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Guarantees no test can reach a live provider even if one were mismarked.
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  GROQ_API_KEY: ""
  OLLAMA_MODEL: ""
  IDENTITY_SALT: ci-fixed-salt-not-a-secret

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Secret scan
        # §7 / §8.6. B8 was originally logged as "secrets in-repo"; the audit
        # found `.env` gitignored with zero commits in history, so the real gap
        # was the ABSENCE of scanning. This closes it, and keeps it closed for
        # commits nobody reviews as carefully.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        # --frozen fails if uv.lock disagrees with pyproject.toml, so a
        # dependency change cannot land without its lockfile update.
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Unit tests
        # Integration tests are excluded deliberately: they require a live LLM
        # provider and GCP credentials. §6.3 -- "CI must never call a real LLM".
        run: uv run pytest -m "not integration" -q

      - name: Domain coverage gate (>=95%)
        # §8.3. Ratchet the --min upward, never down.
        run: uv run python scripts/domain_coverage.py --min 95

      - name: Export the OpenAPI schema
        # The frontend's types are generated from this (§4: "a backend schema
        # change that breaks the frontend must fail tsc in CI"). Exporting it
        # here rather than committing it means the two can never drift.
        run: uv run python scripts/export_openapi.py

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: The generated API client matches the served API
        # `schema.ts` is COMMITTED but GENERATED, which is a combination that
        # rots silently: without this step, "the frontend's types come from the
        # backend" degrades into "they came from the backend once", and `tsc`
        # goes on cheerfully checking the frontend against an API that has since
        # changed. The export above is the schema the app actually serves; if
        # regenerating from it moves the committed file, the client is behind.
        run: |
          npm run generate:api --prefix frontend
          if ! git diff --quiet -- frontend/src/api/schema.ts; then
            echo "::error::frontend/src/api/schema.ts is stale. Regenerate it: uv run python scripts/export_openapi.py && npm --prefix frontend run generate:api"
            git diff -- frontend/src/api/schema.ts
            exit 1
          fi

      - name: Agent eval suite
        # §8.9 / §6.2. BLOCKING, not a report. It runs the real domain logic
        # with the deterministic fake scorer, so no LLM is called and §6.3 holds.
        # A safety-case failure fails the build regardless of the accuracy score:
        # a briefing that should not have been sent is not offset by getting
        # other cases right.
        run: uv run python scripts/agent_eval.py

  web:
    # §8.4 -- tsc --noEmit + vitest for the frontend. Kept as a separate job so
    # a frontend failure is legible on its own rather than buried in the Python
    # log, and so the two can run in parallel.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # TypeScript strict. A backend schema change that breaks the generated
      # types has to fail here.
      - run: npm run typecheck

      # Includes the jest-axe accessibility assertion. §4 treats accessibility
      # as a requirement, not a polish item.
      - run: npm test

      - run: npm run build

  e2e:
    # §8.8 / §9 -- Playwright against the composed stack: the FastAPI server
    # serving the BUILT bundle, with the security middleware in place. That is
    # the configuration that ships. A dev-server E2E would have passed happily
    # while every deep link 401'd, which is exactly the bug this suite caught.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, web]
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      IDENTITY_SALT: ci-fixed-salt-not-a-secret
      # A fixed, deliberately public key so the suite does not have to scrape
      # one from the server log. Its SHA-256 is DERIVED below rather than
      # written here: a 64-hex literal is indistinguishable from a real
      # credential to a secret scanner, and hard-coding it alongside the
      # plaintext also lets the two drift apart silently.
      E2E_API_KEY: ci-e2e-key-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Derive the API key ring from the plaintext key
        run: |
          HASH=$(printf %s "$E2E_API_KEY" | sha256sum | cut -d" " -f1)
          echo "API_KEYS=[{\"id\":\"e2e\",\"role\":\"admin\",\"key_sha256\":\"$HASH\"}]" >> "$GITHUB_ENV"

      - name: Start the server
        # The poll used to `break` on success and fall through on failure, so a
        # server that never started produced a GREEN step and then nine
        # unreadable E2E failures. A readiness check that cannot fail is not a
        # readiness check; this one exits non-zero and prints the server log, so
        # the cause is in the job output rather than inferred from the symptom.
        run: |
          uv run uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/server.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              echo "server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never became healthy within 40s"
          echo "--- server log ---"
          cat /tmp/server.log || echo "(no log produced -- the process never started)"
          exit 1

      - name: E2E
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000

      - name: Server log
        if: failure()
        run: cat /tmp/server.log || echo "(no server log)"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
