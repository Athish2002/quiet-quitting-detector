[project]
name = "quiet-quitting-detector"
version = "1.0.0"
description = "Multi-agent employee disengagement detector: chronological, per-employee baselining, six live data-ingestion sources (SQLite, cloud bucket, CSV, file upload, webhook, natural language), and a local ML fallback that keeps working when the Gemini API is rate-limited."
authors = [
    {name = "Athish R S"},
]
readme = "README.md"
license = "MIT"

dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "scikit-learn>=1.4.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
cloud = [
    "boto3>=1.34.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.per-file-ignores]
# app.py must call load_dotenv() before its other imports: under `uvicorn
# app:app` the config-reading imports below would otherwise run with an empty
# environment (no API keys), silently forcing every local fallback path.
"app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
# Integration tests reach a real LLM provider / real GCP credentials, so they
# cannot run in CI (PRODUCTION_EVOLUTION_PROMPT.md 6.3: "CI must never call a
# real LLM"). They are marked, not deleted -- run locally with `-m integration`.
markers = [
    "integration: requires live network, LLM provider credentials, or a spawned server",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]


