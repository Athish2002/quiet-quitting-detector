<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Quiet-Quitting Detector</title>
    <script type="text/javascript">
      // Prevent Flash of Light Theme (FOUC) on initial load:
      (function() {
        try {
          var saved = localStorage.getItem("theme");
          var prefDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = (saved === "dark" || saved === "light") ? saved : (prefDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();

      // GitHub Pages SPA path restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
